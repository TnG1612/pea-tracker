# Runs fetch_prices.py on GitHub's servers and saves the result in this repository.
name: Update prices

on:
  schedule:                    # times are UTC, Monday(1) to Friday(5)
    - cron: "0 17 * * 1-5"     # after the European closes
    - cron: "30 21 * * 1-5"    # after the US close
  workflow_dispatch:           # adds a "Run workflow" button on GitHub

permissions:
  contents: write              # allows the job to commit prices.json

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Fetch prices
        run: python fetch_prices.py

      - name: Check the data (stops here if something is wrong)
        run: python -m pytest -q

      - name: Commit if something changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json history/
          git diff --cached --quiet || (git commit -m "Update prices $(date -u +'%Y-%m-%d %H:%M')" && git push)
